[package]
name = "kern"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = { workspace = true }
byteorder = { workspace = true }
cfg-if = { workspace = true }
cortex-m = { workspace = true }
serde = { workspace = true }
ssmarshal = { workspace = true }
zerocopy = { workspace = true }

abi = { path = "../abi" }
armv8-m-mpu = { path = "../../lib/armv8-m-mpu" }
phash = { path = "../../lib/phash" }
unwrap-lite = { path = "../../lib/unwrap-lite" }
kerncore.path = "../kerncore"

[build-dependencies]
anyhow = { workspace = true }
indexmap = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
ron = { workspace = true }
serde = { workspace = true }
syn = { workspace = true }

abi = { path = "../abi" }
build-kconfig = { path = "../../build/kconfig" }
build-util = { path = "../../build/util" }
call_rustfmt = { path = "../../build/call_rustfmt" }
phash-gen = { path = "../../build/phash-gen" }

[features]
dump = []
nano = []
stack-watermark = []
# Diagnostic-only: calls an extern "C" uart_checkpoint(msg) at bisection
# points inside start_kernel(). The board's clock_stubs.c must define this
# symbol. Not for normal use -- enabled only by kernel-generic-mcxn947 while
# bisecting a silent post-start_kernel() hang.
diag-uart-checkpoint = []

[lib]
test = false
doctest = false
bench = false

[lints]
workspace = true
